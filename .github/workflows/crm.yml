name: CRM 할 일 자동 생성

on:
  schedule:
    - cron: "50 23 * * 0-4" # 평일 08:50 KST — 할 일 생성
    - cron: "50 4 * * 1-5" # 평일 13:50 KST — 오전 중 바뀐 상태 반영
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼

concurrency:
  group: crm-todo
  cancel-in-progress: false

jobs:
  crm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run CRM rules
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node crm/crm_todo.mjs --no-kakao # 카카오워크 알림은 끔 (26.10) — 할 일은 노션에서 확인
